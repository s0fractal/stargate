name: Python contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.0', '3.12.3', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Architecture
        run: python architecture.py
      - name: Installed wheel tests outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Installation integration
        run: python integration/test_release_gate.py --with-install
