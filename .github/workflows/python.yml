name: Python contract
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.0', '3.12.3', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Architecture
        run: python architecture.py
      - name: Anchors describe this source
        run: python tools/anchors.py --check
      - name: Machine checker is still the vertical baseline
        run: python tools/vertical_baseline.py --check
      - name: Tag name follows the snapshot digest
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/anchors.py --check-tag "$TAG"
      - name: Installed wheel tests outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Installation integration
        run: python integration/test_release_gate.py --with-install
      - name: MCP proxy vertical (registered outcomes, results.json byte-for-byte)
        run: python integration/mcp_proxy_vertical.py
      - name: README walkthrough (every sh block runs; the checkout stays clean)
        run: python tools/readme_walkthrough.py
