name: Python contract
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.0', '3.12.3', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Architecture
        run: python architecture.py
      - name: Anchors describe this source
        run: python tools/anchors.py --check
      - name: Machine checker is still the vertical baseline
        run: python tools/vertical_baseline.py --check
      - name: Tag name follows the snapshot digest
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/anchors.py --check-tag "$TAG"
      - name: Installed wheel tests outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Installation integration
        run: python integration/test_release_gate.py --with-install
      - name: MCP proxy vertical (registered outcomes, results.json byte-for-byte)
        run: python integration/mcp_proxy_vertical.py
      - name: README walkthrough (every sh block runs; the checkout stays clean)
        run: python tools/readme_walkthrough.py
      - name: Interlock shadow experiment (registered outcomes, results.json byte-for-byte)
        run: python integration/interlock_shadow.py
      - name: Sigma verdict vertical (registered outcomes, results.json byte-for-byte)
        run: python integration/sigma_verdict_vertical.py
      - name: Safety synthesis on both live verticals (registered outcomes, byte-for-byte)
        run: python integration/synth_vertical.py
  pr-gate-action:
    # The composite action (action.yml) run end to end against a fixture repository:
    # outcome 13 of docs/PR_GATE_REGISTRY.md. The fixture's heads are local commits,
    # so nothing is fetched; everything else is the action a consumer runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet .
      - id: fixture
        run: python tools/pr_gate_fixture.py "$RUNNER_TEMP/fixture" >> "$GITHUB_OUTPUT"
      - id: good
        uses: ./
        with:
          repository: ${{ runner.temp }}/fixture
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.good }}
          fetch-head: 'false'
          model-path: model.json
          projection-path: projection.json
          evidence-path: .stargate/evidence.json
          expect-checker: ${{ steps.fixture.outputs.checker }}
          expect-projection-checker: ${{ steps.fixture.outputs.projection_checker }}
      - id: bad
        uses: ./
        continue-on-error: true
        with:
          repository: ${{ runner.temp }}/fixture
          base: ${{ steps.fixture.outputs.base }}
          head: ${{ steps.fixture.outputs.bad }}
          fetch-head: 'false'
          model-path: model.json
          projection-path: projection.json
          evidence-path: .stargate/evidence.json
          expect-checker: ${{ steps.fixture.outputs.checker }}
          expect-projection-checker: ${{ steps.fixture.outputs.projection_checker }}
      - name: The good head is verified and the flipped cell is refused
        env:
          GOOD: ${{ steps.good.outputs.status }}/${{ steps.good.outputs.exit-code }}
          BAD: ${{ steps.bad.outputs.status }}/${{ steps.bad.outputs.exit-code }}/${{ steps.bad.outcome }}
        run: |
          test "$GOOD" = "verified/0"
          test "$BAD" = "projection_mismatch/4/failure"
