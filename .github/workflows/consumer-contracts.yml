name: Consumer contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: s0fractal/warrant
          ref: ac80aeebfba09176e7dbf0b4a4eaaec3ee343b06
          path: consumers/warrant
          persist-credentials: false
      - name: Actual Warrant adapter and semantic mutants
        run: python integration/warrant_adapter.py --warrant-root consumers/warrant --expect-results examples/warrant-adapter/results.json
      # Sokol's production-source checks run in its own repository (private source).
      # No cross-repository credential is provisioned here; its model runs in Python CI.
