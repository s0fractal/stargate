name: Consumer contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shadow:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - run: python -m pip install .
      - name: Agent evidence workflow and refusal controls
        run: python integration/agent_evidence.py --output "$RUNNER_TEMP/agent-evidence"
      - name: Two-agent shared action and disagreement controls
        run: python integration/shared_action.py --output "$RUNNER_TEMP/shared-action"
      - name: Shared-action SQLite effect and stale-revision controls
        run: python integration/shared_action_store.py
      - name: Retained local agent intent and receipt recovery
        run: python integration/agent_intents.py
      - name: Public pilot reproduction report
        run: python integration/reproduce.py --profile public --output "$RUNNER_TEMP/stargate-public-replay.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: s0fractal/warrant
          ref: ac80aeebfba09176e7dbf0b4a4eaaec3ee343b06
          path: consumers/warrant
          persist-credentials: false
      - name: Actual Warrant adapter and semantic mutants
        run: python integration/warrant_adapter.py --warrant-root consumers/warrant --expect-results examples/warrant-adapter/results.json
      # Sokol's production-source checks run in its own repository (private source).
      # No cross-repository credential is provisioned here; its model runs in Python CI.
