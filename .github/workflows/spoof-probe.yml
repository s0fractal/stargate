name: Spoof probe (acceptance steps 3 and 5, never merged)
# An ordinary same-repository workflow posts the model gate's context as success on this
# pull request's head with GITHUB_TOKEN, after the App has posted its verdict.
on:
  pull_request:
permissions:
  statuses: write
jobs:
  spoof:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          sleep 150
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state=success \
            -f context=stargate/model-gate -f description="stargate: verified (SPOOF PROBE)"
