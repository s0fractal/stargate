name: Agent review request
# Runs nothing from the pull request and has no permissions. Its completion triggers
# agent-review.yml, which runs from the default branch (docs/AGENT_REVIEW.md).
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - run: echo "requested an agent review for ${{ github.event.pull_request.head.sha }}"
