name: Stargate model gate
description: >-
  Read-only pull-request gate. One verdict about one base commit and one head commit:
  the guarded model changed only through verified Stargate evidence, and its projection
  conforms. Never merges, pushes, changes refs/index/worktree or runs pull-request code.
  Computes a verdict; it does not by itself enforce anything on a pull request's head
  commit (see docs/PR_GATE.md). Runs the action's own source with python3 -I -S: no pip,
  no network beyond fetching the head, no other action.
inputs:
  model-path: {description: 'guarded model file (canonical certificate model)', required: true}
  projection-path: {description: 'its projection-1 table', required: true}
  evidence-path: {description: 'where a pull request puts its certified_change or certified_repair', required: true}
  expect-checker: {description: 'pinned machine proof checker ID', required: true}
  expect-projection-checker: {description: 'pinned ProjectionCheckerID', required: true}
  repository: {description: 'local clone to read', default: '${{ github.workspace }}'}
  base: {description: 'base commit ID', default: '${{ github.event.pull_request.base.sha }}'}
  head: {description: 'head commit ID', default: '${{ github.event.pull_request.head.sha }}'}
  fetch-head: {description: 'fetch the head commit''s objects by ID before reading', default: 'true'}
outputs:
  status: {description: 'the verdict', value: '${{ steps.gate.outputs.status }}'}
  exit-code: {description: '0 verified/untouched, 1 error, 2 invalid, 3 unverified, 4 refused', value: '${{ steps.gate.outputs.exit-code }}'}
runs:
  using: composite
  steps:
    - shell: bash
      run: python3 -I -S -c 'import sys; sys.exit(0 if sys.version_info >= (3, 11) else "the gate needs python3 >= 3.11 on the runner")'
    - if: inputs.fetch-head == 'true'
      shell: bash
      env: {REPO: '${{ inputs.repository }}', HEAD_SHA: '${{ inputs.head }}'}
      run: git -C "$REPO" fetch --quiet --no-tags origin "$HEAD_SHA"
    - id: gate
      shell: bash
      env:
        REPO: '${{ inputs.repository }}'
        BASE: '${{ inputs.base }}'
        HEAD_SHA: '${{ inputs.head }}'
        MODEL: '${{ inputs.model-path }}'
        PROJECTION: '${{ inputs.projection-path }}'
        EVIDENCE: '${{ inputs.evidence-path }}'
        CHECKER: '${{ inputs.expect-checker }}'
        PCHECKER: '${{ inputs.expect-projection-checker }}'
      run: >-
        python3 -I -S "$GITHUB_ACTION_PATH/tools/pr_gate.py" --github --repository "$REPO"
        --base "$BASE" --head "$HEAD_SHA" --model-path "$MODEL" --projection-path "$PROJECTION"
        --evidence-path "$EVIDENCE" --expect-checker "$CHECKER" --expect-projection-checker "$PCHECKER"
